# 生产同源路由，复刻 vite dev proxy（frontend/vite.config.ts）的行为：
#   /api、/static、/{user_id}/{page_id}（两段正则）→ backend:8000
#   其余 → SPA（dist + index.html fallback）
# ⚠️ 发布页正则与 vite.config.ts 双处维护，改动需同步。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 头像上传 ≤2MB，留余量
    client_max_body_size 4m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── API（含 SSE 生成流）── ^~ 保证正则不参与匹配
    # proxy_pass 结尾不带 URI → 路径原样透传（带 / 会把 /api/xxx 重写成 /xxx）
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;          # SSE 实时推送（后端也发了 X-Accel-Buffering: no，此处兜底）
        proxy_cache off;
        proxy_read_timeout 300s;      # LLM 生成流可持续数分钟
        proxy_send_timeout 300s;
    }

    # ── 静态资源（avatars / snapshots / interactions.js）── 原样透传
    location ^~ /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 发布页 /{user_id}/{page_id} ── 与 vite.config.ts 的正则代理一致
    # （nginx location 不匹配 query string，去掉 vite 正则里的 (\?.*)?；
    #   负向前瞻排除 /admin、/api、/static 前缀。nginx:alpine 内置 PCRE）
    location ~ "^/(?!admin|api|static)[a-zA-Z0-9_-]{3,30}/[a-zA-Z0-9_-]{1,50}$" {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── vite 哈希产物：长缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback：/、/login、/gallery、/creation、/:userId 等全部回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
